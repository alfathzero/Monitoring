<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tg-theme-text-color,#f5f5f5);background:var(--tg-theme-bg-color,#0b0b12);padding-bottom:8px}
  .hero{background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 45%,#312e81 100%);color:#fff;padding:13px 14px 11px}
  .htop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .brand{font-size:8px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;opacity:.82}
  .title{font-size:19px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin-top:2px}
  .badge{display:flex;align-items:center;gap:5px;font-size:8.5px;font-weight:800;letter-spacing:.06em;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:4px 8px;border-radius:999px;white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}
  .clock{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:6px;opacity:.95}
  .date{font-size:8.5px;opacity:.72;margin-top:1px}
  .body{padding:9px 11px 4px}
  .grid{display:grid;gap:6px;margin-bottom:7px}
  .card{background:var(--tg-theme-secondary-bg-color,rgba(255,255,255,.07));border:1px solid rgba(127,127,127,.14);border-radius:11px;padding:7px 8px;min-width:0}
  .k{font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--tg-theme-hint-color,#9ca3af);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .v{font-size:16px;font-weight:800;margin-top:1px;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{height:4px;border-radius:99px;background:rgba(127,127,127,.26);overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#22d3ee,#3b82f6)}
  .sub{font-size:8px;color:var(--tg-theme-hint-color,#9ca3af);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .rows{background:var(--tg-theme-secondary-bg-color,rgba(255,255,255,.07));border:1px solid rgba(127,127,127,.14);border-radius:10px;padding:1px 9px;margin-bottom:7px}
  .rows div{display:flex;justify-content:space-between;gap:9px;padding:3.5px 0;font-size:9px;border-bottom:1px solid rgba(127,127,127,.14)}
  .rows div:last-child{border:0}
  .rows span{color:var(--tg-theme-hint-color,#9ca3af);flex:0 0 auto}
  .rows b{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
  .chip{font-size:8.5px;font-family:ui-monospace,monospace;background:var(--tg-theme-secondary-bg-color,rgba(255,255,255,.07));border:1px solid rgba(127,127,127,.18);border-radius:6px;padding:2.5px 5px}
  .note{font-size:8.5px;line-height:1.5;color:var(--tg-theme-hint-color,#9ca3af);text-align:center;padding:1px 2px 6px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
  button{font:inherit;border:0;border-radius:9px;padding:8px 5px;font-size:10px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:active{transform:scale(.985)}
  .primary{background:var(--tg-theme-button-color,#2563eb);color:var(--tg-theme-button-text-color,#fff)}
  .soft{background:var(--tg-theme-secondary-bg-color,rgba(255,255,255,.09));color:var(--tg-theme-text-color,#f5f5f5);border:1px solid rgba(127,127,127,.2)}
  .green{background:#16a34a;color:#fff}
  .wide{width:100%}
  .msg{text-align:center;font-size:8.5px;color:var(--tg-theme-hint-color,#9ca3af);min-height:10px;font-variant-numeric:tabular-nums}
  .menu{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px}
  .menu button{background:var(--tg-theme-secondary-bg-color,rgba(255,255,255,.07));color:var(--tg-theme-text-color,#f5f5f5);border:1px solid rgba(127,127,127,.16);text-align:left;padding:7px 8px;font-size:9.5px;font-weight:700}
  .menu button:active{background:var(--tg-theme-button-color,#2563eb);color:#fff}
  .hint{font-size:8px;line-height:1.5;color:var(--tg-theme-hint-color,#9ca3af);padding:4px 2px 2px;text-align:center}
  .hidden{display:none}
</style>
</head>
<body>
<div class="hero">
  <div class="htop">
    <div>
      <div class="brand">KOSMOS MONITOR</div>
      <div class="title" id="title">VPS Telemetry</div>
    </div>
    <div class="badge"><span class="dot"></span><span>ONLINE</span></div>
  </div>
  <div class="clock" id="clock">--:--:--</div>
  <div class="date" id="date">--</div>
</div>
<div class="body">
  <div id="home">
    <div id="view"></div>
    <div class="row">
      <button class="green" id="refresh" type="button">🔄 Refresh</button>
      <button class="soft" id="auto" type="button">📡 Auto: OFF</button>
    </div>
    <div class="row">
      <button class="soft" id="menuBtn" type="button">☰ Menu</button>
      <button class="primary" id="dash" type="button">🌐 Dashboard</button>
    </div>
  </div>
  <div id="menu" class="hidden">
    <div class="menu">
      <button type="button" data-cmd="/start">📊 Dashboard</button>
      <button type="button" data-cmd="/status">📈 Status</button>
      <button type="button" data-cmd="/live">🟢 Live</button>
      <button type="button" data-cmd="/stop_live">🔴 Stop</button>
      <button type="button" data-cmd="/ping">⏱️ Ping</button>
      <button type="button" data-cmd="/cpu">💻 CPU</button>
      <button type="button" data-cmd="/ram">🧠 RAM</button>
      <button type="button" data-cmd="/disk">💾 Disk</button>
      <button type="button" data-cmd="/bandwidth">⚡ Bandwidth</button>
      <button type="button" data-cmd="/help">ℹ️ Help</button>
      <button type="button" data-cmd="/emoji">😀 Emoji</button>
      <button type="button" data-cmd="/setpwd">🔐 Password</button>
    </div>
    <button class="soft wide" id="backBtn" type="button">← Balik</button>
    <div class="hint">Tiap menu langsung mengubah halaman widget ini.</div>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
(function () {
  var W = window.TelegramWidget;
  if (!W) {
    document.getElementById('view').innerHTML = '<div class="note">Widget Telegram tidak tersedia di sini.</div>';
    return;
  }
  var cur = null, busy = false, timer = null;

  function byId(id) { return document.getElementById(id); }
  function set(id, text) { var el = byId(id); if (el) el.textContent = text; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function parse(s) { try { return s ? JSON.parse(s) : null; } catch (e) { return null; } }

  function clock() {
    var n = new Date();
    set('clock', pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':' + pad(n.getSeconds()));
    var days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    set('date', days[n.getDay()] + ', ' + n.getDate() + ' ' + months[n.getMonth()] + ' ' + n.getFullYear());
  }
  function note(text) {
    var el = byId('msg');
    if (!el) return;
    el.textContent = text || '';
    if (note._t) clearTimeout(note._t);
    note._t = setTimeout(function () { el.textContent = ''; }, 2600);
  }

  function render(d) {
    if (!d || !d.v) return;
    var next = Number(d.u) || 0, prev = Number(cur && cur.u) || 0;
    if (prev && next && next < prev) return;
    cur = d;
    set('title', d.t || 'VPS Telemetry');
    var h = '', c = d.c || [], r = d.r || [], ch = d.ch || [], i;
    if (c.length) {
      var cols = c.length <= 3 ? c.length : 2;
      h += '<div class="grid" style="grid-template-columns:repeat(' + cols + ',1fr)">';
      for (i = 0; i < c.length; i++) {
        var it = c[i] || [], pct = Number(it[2]), bar = '';
        if (it[2] != null && !isNaN(pct)) {
          pct = Math.max(0, Math.min(100, pct));
          bar = '<div class="bar"><i style="width:' + pct + '%"></i></div>';
        }
        h += '<div class="card"><div class="k">' + esc(it[0]) + '</div><div class="v">' + esc(it[1]) + '</div>' + bar +
          (it[3] ? '<div class="sub">' + esc(it[3]) + '</div>' : '') + '</div>';
      }
      h += '</div>';
    }
    if (r.length) {
      h += '<div class="rows">';
      for (i = 0; i < r.length; i++) {
        h += '<div><span>' + esc((r[i] || [])[0]) + '</span><b>' + esc((r[i] || [])[1]) + '</b></div>';
      }
      h += '</div>';
    }
    if (ch.length) {
      h += '<div class="chips">';
      for (i = 0; i < ch.length; i++) h += '<span class="chip">' + esc(ch[i]) + '</span>';
      h += '</div>';
    }
    if (d.n) h += '<div class="note">' + esc(d.n) + '</div>';
    byId('view').innerHTML = h || '<div class="note">Tidak ada data.</div>';
  }

  function showMenu(open) {
    byId('home').className = open ? 'hidden' : '';
    byId('menu').className = open ? '' : 'hidden';
  }

  function ask(code, label, keepMenu) {
    if (busy) return;
    busy = true;
    if (label) note(label);
    W.request(code).then(function (a) {
      var d = parse(a && a.result);
      if (d && d.v) { render(d); if (!keepMenu) showMenu(false); }
    }).catch(function (err) {
      note('Gagal: ' + ((err && err.code) || 'ERROR'));
    }).then(function () { busy = false; });
  }

  function refresh(manual) {
    if (busy) return;
    busy = true;
    if (manual) note('Memperbarui...');
    W.request('refresh:' + ((cur && cur.v) || 'dash')).then(function () {
      if (manual) note('Metrik terbaru');
    }).catch(function (err) {
      if (manual) note('Gagal: ' + ((err && err.code) || 'ERROR'));
    }).then(function () { busy = false; });
  }

  clock();
  setInterval(clock, 1000);
  render(parse(W.chatData));
  if (!cur) note('Menunggu data...');

  W.onEvent('chatDataChanged', function () {
    render(parse(W.chatData));
  });

  byId('refresh').addEventListener('click', function () { refresh(true); });
  byId('auto').addEventListener('click', function () {
    var btn = this;
    if (timer) {
      clearInterval(timer);
      timer = null;
      btn.textContent = '📡 Auto: OFF';
      note('Auto refresh dimatikan');
    } else {
      timer = setInterval(function () { refresh(false); }, 5000);
      btn.textContent = '📡 Auto: ON';
      note('Auto refresh tiap 5 detik');
    }
  });
  byId('menuBtn').addEventListener('click', function () { showMenu(true); });
  byId('backBtn').addEventListener('click', function () { showMenu(false); });
  byId('dash').addEventListener('click', function () { ask('cmd:/start', '', true); showMenu(false); });
  byId('menu').addEventListener('click', function (e) {
    var b = e.target;
    while (b && b !== this && b.tagName !== 'BUTTON') b = b.parentNode;
    if (!b || b === this) return;
    var cmd = b.getAttribute('data-cmd');
    if (cmd) ask('cmd:' + cmd, 'Membuka ' + cmd.slice(1) + '...');
  });
  if (W.ready) W.ready();
})();
</script>
</body>
</html>
